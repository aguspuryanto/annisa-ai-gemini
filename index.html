    <script>
      // Fix "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          const nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          let customFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
